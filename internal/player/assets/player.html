<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="{{.AssetBase}}/player.css?v={{.AssetVersion}}">
</head>
<body class="ari-body">
  <div class="ari-player" id="ari-player" data-stream-id="{{.StreamID}}"></div>

  <script id="ari-config" type="application/json">{{.ConfigJSON}}</script>
  {{if .DashJSURL}}<script src="{{.DashJSURL}}"></script>{{end}}
  {{if .ClapprURL}}<script src="{{.ClapprURL}}"></script>{{end}}
  <script src="{{.AssetBase}}/player.js?v={{.AssetVersion}}"></script>
</body>
</html>
