# Ari Media Engine — sample configuration.
# Every value below can be overridden with an ARI_* environment variable.

server:
  host: 0.0.0.0
  port: 8080
  read_timeout_sec: 15
  write_timeout_sec: 15
  shutdown_timeout_sec: 15
  dashboard_dir: web/dashboard
  # public_url is advertised to players and embed snippets (e.g. https://media.example.com).
  public_url: ""
  # Set both to serve HTTPS directly (e.g. behind Cloudflare Full or a load balancer).
  tls_cert_file: ""
  tls_key_file: ""

webrtc:
  # Advertised host candidates for NAT traversal (set to your public IP(s) in production).
  ice_public_ips: []
  ice_tcp_port: 7881
  ice_udp_port_min: 50000
  ice_udp_port_max: 50100
  enable_loopback: true
  max_subscribers_per_broadcast: 1000
  # Optional STUN/TURN servers (public ICE) used by the engine and the player.
  # STUN discovers addresses; TURN relays media when direct UDP is blocked.
  #   - urls: ["stun:stun.l.google.com:19302"]
  #   - urls: ["turn:turn.example.com:3478"]
  #     username: user
  #     credential: pass
  ice_servers: []
  # "all" (UDP + TCP, default) or "tcp" (ICE-TCP only, when UDP is blocked).
  # Note: ICE-TCP still advertises the server's public IP to clients.
  ice_transport: all

log:
  level: info
  format: json

storage:
  driver: local          # local | s3
  local_root: ./data/recordings
  # public_base prefixes recording URLs, e.g. https://media.example.com/recordings
  public_base: ""
  s3_endpoint: ""
  s3_bucket: ""
  s3_region: ""
  s3_access_key: ""
  s3_secret_key: ""
  s3_use_ssl: false

cluster:
  enabled: false
  redis_url: redis://localhost:6379/0
  node_id: ""
  heartbeat_sec: 5

ingest:
  rtmp:
    enabled: true
    port: 1935
  srt:
    enabled: true
    port: 8890
    # Publishers connect with srt://host:8890?streamid=STREAM_ID (MPEG-TS).
  rtsp:
    enabled: false
    port: 8554
    # RTSP pull sources started at boot: "url" or "streamId=url".
    sources: []

hls:
  enabled: true
  segment_sec: 2
  playlist_size: 6
  low_latency: false
  output_dir: ./data/hls

auth:
  enabled: false
  jwt_secret: ""
  api_key: ""
  # Dashboard login (active when enabled). If username is empty the API key acts
  # as the password with username "admin".
  username: ""
  password: ""
  session_ttl_sec: 43200

# Iframe embedding security. When allow_all_embed is false, only the domains
# listed here (globally) or per stream may frame a stream. A leading "*." matches
# any subdomain.
security:
  allow_all_embed: false
  allowed_domains:
    - example.com
    - "*.trusted-partner.net"
  enforce_origin: true
  # Apply the Content-Security-Policy to the player page only (not the dashboard/API).
  csp_player_only: false

player:
  title: Ari Media Engine
  ws_path: /ws
  hls_base: /hls
  dash_base: /dash
  low_latency_default: true
  # Optional dash.js build for DASH playback (defaults to the bundled build).
  dash_js_url: ""
  # Optional hls.js build for HLS playback (defaults to the bundled build).
  hls_js_url: ""

webhooks:
  enabled: false
  urls: []
  secret: ""

# FFmpeg-based adaptive bitrate ladder. When enabled, each ingested stream is
# transcoded into multiple HLS renditions under <output_dir>/<streamID>/ and
# served at /hls/<streamID>/index.m3u8.
transcode:
  enabled: false
  ffmpeg_path: ffmpeg
  output_dir: ./data/hls
  segment_sec: 2
  list_size: 6
  preset: veryfast
  renditions:
    - name: 1080p
      width: 1920
      height: 1080
      bitrate: 5000k
      maxrate: 5350k
      bufsize: 7500k
    - name: 720p
      width: 1280
      height: 720
      bitrate: 2800k
      maxrate: 2996k
      bufsize: 4200k
    - name: 480p
      width: 854
      height: 480
      bitrate: 1200k
      maxrate: 1284k
      bufsize: 1800k

# Signed playback tokens for HLS/DASH. When enabled, playlists and segments must
# carry a valid token in the URL path; the dashboard can toggle this at runtime.
token:
  enabled: false
  secret: ""
  ttl_sec: 3600

# Stream recording. When enabled, each publisher's raw FLV is recorded and
# uploaded to the configured storage backend (local or S3) on unpublish.
recording:
  enabled: false
  auto_record: true
  work_dir: ./data/recordings

# Peer-assisted delivery (SwarmCloud-style). Viewers of a stream form a WebRTC
# data-channel mesh via the tracker at ws_path and share HLS/DASH segments,
# falling back to the origin. Toggleable at runtime from the dashboard/API.
p2p:
  enabled: false
  ws_path: /p2p/ws
  max_peers: 4

# AAC->Opus audio transcode so WebRTC subscribers receive audio (browsers do not
# negotiate AAC). Requires ffmpeg; the RTMP video path is unaffected.
audio:
  enabled: false
  bitrate: 96k
